# Sveltia CMS configuration (Decap-compatible) — https://sveltiacms.app/en/docs
backend:
  name: github
  repo: amkhoyan/personalwebsite
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

# Uploaded photos are converted to WebP and scaled down so the site stays fast.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

i18n:
  structure: single_file
  locales: [en, hy]
  default_locale: en
  # Every entry can be written in just one language; the other is optional.
  initial_locales: all

collections:
  # ---------------------------------------------------------------- Projects
  - name: projects
    label: Projects
    label_singular: Project
    description: Everything you've worked on — product work and non-IT projects alike. Use the category to tell them apart.
    folder: content/projects
    extension: json
    format: json
    create: true
    i18n: true
    slug: "{{uuid_short}}"
    identifier_field: title
    summary: "{{title}} — {{category}}, {{fields.year}}"
    sortable_fields: [title, year, category]
    view_filters:
      - { label: Product, field: category, pattern: product }
      - { label: Tech, field: category, pattern: tech }
      - { label: Community, field: category, pattern: community }
      - { label: Volunteering, field: category, pattern: volunteering }
      - { label: Creative, field: category, pattern: creative }
      - { label: Education, field: category, pattern: education }
      - { label: Sport, field: category, pattern: sport }
      - { label: Personal, field: category, pattern: personal }
      - { label: For the love of it, field: category, pattern: love }
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string, i18n: true, required: false, hint: "Fill in English, Armenian, or both. The project only appears in the languages that have a title." }
      - { label: One-line summary, name: summary, widget: text, i18n: true, required: false, hint: "Shown in the project list." }
      - label: Category
        name: category
        widget: select
        i18n: duplicate
        default: product
        options:
          - { label: "Product", value: product }
          - { label: "Tech", value: tech }
          - { label: "Community", value: community }
          - { label: "Volunteering", value: volunteering }
          - { label: "Creative", value: creative }
          - { label: "Education", value: education }
          - { label: "Sport", value: sport }
          - { label: "Personal", value: personal }
          - { label: "For the love of it", value: love }
      - { label: Year, name: year, widget: string, i18n: duplicate, required: false, hint: "e.g. 2025 or 2023 — 2025" }
      - { label: Your role, name: role, widget: string, i18n: true, required: false }
      - label: Status
        name: status
        widget: select
        i18n: duplicate
        default: completed
        options:
          - { label: "Live", value: live }
          - { label: "Ongoing", value: ongoing }
          - { label: "Completed", value: completed }
          - { label: "Archived", value: archived }
      - { label: Featured on home page, name: featured, widget: boolean, i18n: duplicate, default: false, required: false }
      - { label: Tags, name: tags, widget: list, i18n: true, required: false, hint: "Comma-separated" }
      - { label: Link, name: link, widget: string, i18n: duplicate, required: false, hint: "Optional URL to the product, article, or photos." }
      - { label: Cover image, name: image, widget: image, i18n: duplicate, required: false }
      - &icons
        label: Icon
        name: icon
        widget: select
        i18n: duplicate
        required: false
        default: box
        options: [box, target, users, chart, map, flag, rocket, heart, camera, trophy, book, globe, pen, doc, code, chat, mail, layout, server]
      - &colors
        label: Color
        name: color
        widget: select
        i18n: duplicate
        required: false
        default: orange
        options: [orange, blue, yellow, green, purple, pink, teal, red]
      - { label: Details, name: body, widget: markdown, i18n: true, required: false, hint: "Optional longer story — shown when someone opens the project." }

  # ---------------------------------------------------------------- Writing
  - name: posts
    label: Writing
    label_singular: Post
    folder: content/posts
    extension: json
    format: json
    create: true
    i18n: true
    slug: "{{uuid_short}}"
    identifier_field: title
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string, i18n: true, required: false, hint: "Fill in English, Armenian, or both. The post only appears in the languages that have a title." }
      - { label: Date, name: date, widget: datetime, i18n: duplicate, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: Short summary, name: summary, widget: text, i18n: true, required: false }
      - { label: Draft (hidden from site), name: draft, widget: boolean, i18n: duplicate, default: false, required: false }
      - { label: Body, name: body, widget: markdown, i18n: true, required: false }

  # ---------------------------------------------------------------- Coffee
  - name: coffee_equipment
    label: "Coffee: Equipment"
    label_singular: Coffee gear
    description: Brewers, grinders and other gear. Shown under Coffee → Equipment.
    folder: content/coffee/equipment
    extension: json
    format: json
    create: true
    i18n: true
    slug: "{{uuid_short}}"
    identifier_field: name
    summary: "{{name}} ({{type}})"
    sortable_fields: [name, type]
    view_filters:
      - { label: Brewers, field: type, pattern: brewer }
      - { label: Grinders, field: type, pattern: grinder }
      - { label: Other, field: type, pattern: other }
    editor: { preview: false }
    fields:
      - { label: Name, name: name, widget: string, i18n: true, required: false, hint: "e.g. Comandante C40. Leave Armenian empty to use the English name." }
      - label: Type
        name: type
        widget: select
        i18n: duplicate
        default: brewer
        options:
          - { label: "Brewer", value: brewer }
          - { label: "Grinder", value: grinder }
          - { label: "Other", value: other }
      - { label: Main photo, name: image, widget: image, i18n: duplicate, required: false }
      - { label: Short description, name: notes, widget: text, i18n: true, required: false, hint: "One or two lines, shown on the card." }
      - { label: Using since, name: since, widget: string, i18n: duplicate, required: false, hint: "e.g. 2024" }
      - { label: Full story, name: body, widget: markdown, i18n: true, required: false, hint: "Shown on the item's own page — why you chose it, how you use it, recipes, tips." }
      - label: More photos
        name: photos
        widget: list
        required: false
        field: { label: Photo, name: photo, widget: image }
      - { label: Link, name: link, widget: string, i18n: duplicate, required: false, hint: "Optional, e.g. the maker's page." }

  - name: latte_art
    label: "Coffee: Latte art"
    label_singular: Latte art photo
    description: Photos of your latte art. Shown under Coffee → Latte art.
    folder: content/coffee/latte-art
    extension: json
    format: json
    create: true
    i18n: true
    slug: "{{uuid_short}}"
    identifier_field: caption
    summary: "{{caption}} {{fields.date}}"
    sortable_fields: [date]
    editor: { preview: false }
    fields:
      - { label: Photo, name: image, widget: image, i18n: duplicate }
      - { label: Caption, name: caption, widget: string, i18n: true, required: false }
      - { label: Date, name: date, widget: datetime, i18n: duplicate, required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }

  # ---------------------------------------------------------------- Services
  - name: services
    label: Services
    label_singular: Service
    description: Paid consultations and sessions you offer. Shown in the Services window; the Book button opens your booking link or an email to you.
    folder: content/services
    extension: json
    format: json
    create: true
    i18n: true
    slug: "{{uuid_short}}"
    identifier_field: title
    summary: "{{title}} — {{fields.price}}"
    sortable_fields: [order, title]
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string, i18n: true, required: false, hint: "Fill in English, Armenian, or both. The service only appears in the languages that have a title." }
      - { label: Short description, name: summary, widget: text, i18n: true, required: false, hint: "Shown on the card." }
      - { label: Price, name: price, widget: string, i18n: true, required: false, hint: "e.g. 25,000 AMD or $60. Leave empty to show 'Price on request'." }
      - { label: Duration, name: duration, widget: string, i18n: true, required: false, hint: "e.g. 60 min" }
      - label: Format
        name: format
        widget: select
        i18n: duplicate
        default: both
        options:
          - { label: "Online", value: online }
          - { label: "In person", value: in_person }
          - { label: "Online or in person", value: both }
      - { label: "What's included", name: includes, widget: list, i18n: true, required: false, hint: "One item per line, shown as a checklist." }
      - { label: Details, name: body, widget: markdown, i18n: true, required: false, hint: "Longer description on the service's own page." }
      - { label: Image, name: image, widget: image, i18n: duplicate, required: false }
      - { label: Booking link, name: booking_url, widget: string, i18n: duplicate, required: false, hint: "Calendly, Cal.com, Google booking page… If empty, Book opens an email to you." }
      - { label: Order, name: order, widget: number, i18n: duplicate, default: 10, value_type: int, required: false, hint: "Lower numbers show first." }
      - { label: Draft (hidden from site), name: draft, widget: boolean, i18n: duplicate, default: false, required: false }

  # ---------------------------------------------------------------- Site settings
  - name: settings
    label: Site settings
    i18n: true
    editor: { preview: false }
    files:
      - name: settings
        label: Home, About, Resume & Contact
        file: content/settings.json
        format: json
        i18n: true
        fields:
          # --- Identity (same in every language unless translated)
          - { label: Full name, name: name, widget: string, i18n: true }
          - { label: First name, name: short_name, widget: string, i18n: true }
          - { label: Logo text, name: logo_text, widget: string, hint: "Shown top-left, e.g. aram.pm" }
          - { label: Email, name: email, widget: string }
          - { label: Photo, name: photo, widget: image, required: false, hint: "Optional. Leave empty to show the dragon." }
          - label: Social links
            name: links
            widget: list
            summary: "{{label}}"
            fields:
              - { label: Name, name: label, widget: string }
              - { label: Handle, name: handle, widget: string, required: false }
              - { label: URL, name: url, widget: string }
              - *icons
              - *colors
          # --- Translations
          - label: Armenian translation
            name: translations
            widget: object
            required: false
            collapsed: false
            hint: "Switch a section off to show it in English to Armenian visitors, even if the Armenian text is filled in. Your Armenian text is kept."
            fields:
              - { label: Home, name: home, widget: boolean, default: true, required: false }
              - { label: About, name: about, widget: boolean, default: true, required: false }
              - { label: Projects, name: projects, widget: boolean, default: true, required: false }
              - { label: Writing, name: writing, widget: boolean, default: true, required: false }
              - { label: Resume, name: resume, widget: boolean, default: true, required: false }
              - { label: Coffee, name: coffee, widget: boolean, default: true, required: false }
              - { label: Services, name: services, widget: boolean, default: true, required: false }
              - { label: Contact, name: contact, widget: boolean, default: true, required: false }
          # --- Home
          - { label: Greeting chip, name: eyebrow, widget: string, i18n: true }
          - { label: Headline, name: headline, widget: string, i18n: true, hint: "Wrap a word in **double stars** to underline it in yellow." }
          - { label: Tagline, name: tagline, widget: text, i18n: true }
          - label: What I do
            name: skills
            widget: list
            i18n: true
            summary: "{{title}}"
            hint: "Icon and colour can be left empty in Armenian — they're taken from English."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: string }
              - *icons
              - *colors
          - label: By the numbers
            name: stats
            widget: list
            i18n: true
            summary: "{{value}} {{label}}"
            fields:
              - { label: Number, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          # --- About
          - { label: About me, name: about, widget: markdown, i18n: true }
          - { label: Location, name: location, widget: string, i18n: true }
          - label: Right now
            name: now
            widget: list
            i18n: true
            summary: "{{label}}: {{value}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
          - label: Fun facts
            name: facts
            widget: list
            i18n: true
            summary: "{{text}}"
            field: { label: Fact, name: text, widget: string }
          # --- Resume
          - { label: Services intro, name: services_intro, widget: text, i18n: true, required: false, hint: "Short intro at the top of the Services window." }
          - { label: Open to new roles, name: open_to_work, widget: boolean, default: false, required: false, hint: "When on, your llms.txt and resume.md tell AI recruiting tools you're looking." }
          - { label: Looking for, name: looking_for, widget: text, required: false, hint: "Optional, e.g. Senior PM roles in fintech or mobile; remote or Yerevan. Shown to AI tools only when 'Open to new roles' is on." }
          - { label: Resume headline, name: resume_title, widget: string, i18n: true, required: false, hint: "Shown under your name, e.g. Product Manager · Mobile & Fintech" }
          - { label: Resume summary, name: resume_summary, widget: text, i18n: true, required: false }
          - label: Work experience
            name: resume
            widget: list
            i18n: true
            summary: "{{when}} · {{role}} @ {{org}}"
            fields:
              - { label: When, name: when, widget: string, required: false }
              - { label: Role / degree, name: role, widget: string }
              - { label: Organisation, name: org, widget: string }
              - { label: Description, name: description, widget: text, required: false, hint: "Start a line with “- ” to make a bullet point." }
          - label: Education
            name: education
            widget: list
            i18n: true
            required: false
            summary: "{{degree}} — {{school}}"
            fields:
              - { label: Degree, name: degree, widget: string }
              - { label: School, name: school, widget: string }
              - { label: When, name: when, widget: string, required: false }
          - label: Skills
            name: resume_skills
            widget: list
            i18n: true
            required: false
            summary: "{{title}}"
            fields:
              - { label: Group, name: title, widget: string }
              - { label: Skills, name: items, widget: list, hint: "Comma-separated" }
          - label: Languages
            name: resume_languages
            widget: list
            i18n: true
            required: false
            summary: "{{language}} — {{level}}"
            fields:
              - { label: Language, name: language, widget: string }
              - { label: Level, name: level, widget: string }
          - { label: Resume PDF, name: resume_pdf, widget: file, required: false, hint: "Optional. Adds a Download PDF button to the resume." }
