<style>
  :root {
    --bg: #F3EEE4;
    --surface: #FBF8F2;
    --surface-2: #ECE5D8;
    --text: #1C1814;
    --muted: #6B6358;
    --ink: #1C1814;
    --border: #CDC2AF;
    --border-light: #E1D8C8;
    --accent: #C8402F;
    --accent-ink: #FFFFFF;
    --mark: rgba(227, 167, 47, .45);
    --grid: rgba(28, 24, 20, .055);
    --wall-line: rgba(28, 24, 20, .16);
    --wall-text: rgba(28, 24, 20, .09);
    --hard: #1C1814;
    --orange: #D9622B;
    --blue: #2F5D9E;
    --yellow: #E3A72F;
    --green: #4E8A5A;
    --purple: #7A4C9E;
    --teal: #2A8C82;
    --pink: #C9577A;
    --red: #C8402F;
    --brown: #8B5A2B;
    --slate: #7D766B;
    --highlight: rgba(200, 64, 47, .1);
  }
  :root[data-theme="dark"] {
    --bg: #16130F; --surface: #201C17; --surface-2: #2A251F; --text: #F1EADD; --muted: #A79E90;
    --ink: #4A4237; --border: #4A4237; --border-light: #322C25; --accent: #E0563F;
    --mark: rgba(227, 167, 47, .35); --grid: rgba(241, 234, 221, .045); --wall-line: rgba(241, 234, 221, .14);
    --wall-text: rgba(241, 234, 221, .06); --hard: #000; --highlight: rgba(224, 86, 63, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16130F; --surface: #201C17; --surface-2: #2A251F; --text: #F1EADD; --muted: #A79E90;
      --ink: #4A4237; --border: #4A4237; --border-light: #322C25; --accent: #E0563F;
      --mark: rgba(227, 167, 47, .35); --grid: rgba(241, 234, 221, .045); --wall-line: rgba(241, 234, 221, .14);
      --wall-text: rgba(241, 234, 221, .06); --hard: #000; --highlight: rgba(224, 86, 63, .16);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Instrument Sans", "Noto Sans Armenian", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; font-weight: 600; }
  a:hover { text-decoration-thickness: 2px; }
  button { font: inherit; color: inherit; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .serif, h1, h2 { font-family: "Fraunces", "Noto Serif Armenian", Georgia, serif; }

  /* ---------- Wallpaper ---------- */
  .wall {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .wall-name {
    position: absolute; left: 4vw; bottom: 150px; margin: 0;
    font-family: "Fraunces", "Noto Serif Armenian", Georgia, serif; font-style: italic; font-weight: 600;
    font-size: clamp(64px, 12vw, 190px); line-height: .9; letter-spacing: -.04em; color: var(--wall-text); white-space: nowrap;
  }
  .wall-coords { position: absolute; left: calc(4vw + 6px); bottom: 122px; font-size: 12px; color: var(--muted); letter-spacing: .08em; opacity: .7; }
  .wall-ararat { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 240px; }

  /* ---------- Top tray ---------- */
  .tray {
    position: fixed; top: 12px; z-index: 10000; display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 5px;
    box-shadow: 3px 3px 0 var(--hard);
  }
  .tray.left { left: 14px; }
  .tray.right { right: 14px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; background: none; border: 0; padding: 2px 12px 2px 2px; border-radius: 999px; white-space: nowrap; }
  .logo:hover { background: var(--surface-2); }
  .logo-name { font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500; }
  .monogram {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink); font-family: "Fraunces", "Noto Serif Armenian", serif; font-style: italic; font-weight: 700; font-size: 15px;
  }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; background: none; border: 0; border-radius: 50%; cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); }
  .clock { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 8px; }
  .lang { display: flex; background: var(--surface-2); border-radius: 999px; padding: 2px; }
  .lang button { border: 0; background: none; padding: 2px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); border-radius: 999px; }
  .lang button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

  /* ---------- Dock ---------- */
  .dock {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10000;
    display: flex; align-items: center; gap: 4px; max-width: calc(100% - 28px);
    background: var(--surface); border: 1.5px solid var(--ink); border-radius: 20px; padding: 7px 8px;
    box-shadow: 4px 4px 0 var(--hard);
  }
  .dock-apps, .tabs { display: flex; align-items: center; gap: 4px; }
  .tabs:empty, .tabs:empty + .dock-sep { display: none; }
  .dock-sep { width: 1.5px; align-self: stretch; margin: 4px 6px; background: var(--border); border-radius: 2px; }
  .dock-app { position: relative; width: 48px; height: 52px; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 12px; }
  .dock-app svg { width: 42px; height: 42px; transition: transform .14s cubic-bezier(.3, 1.6, .6, 1); }
  .dock-app:hover svg, .dock-app:focus-visible svg { transform: translateY(-5px) rotate(-4deg); }
  .dock-app:focus { outline: none; }
  .dock-app::after { content: ""; position: absolute; bottom: -1px; width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .dock-app.open::after { background: var(--muted); }
  .dock-app.active::after { background: var(--accent); width: 14px; border-radius: 3px; }
  .dock-app span {
    position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(4px);
    background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s;
  }
  .dock-app:hover span, .dock-app:focus-visible span { opacity: 1; transform: translateX(-50%); }
  .tab {
    display: flex; align-items: center; gap: 6px; white-space: nowrap; height: 34px;
    border: 1.5px solid var(--border); background: var(--bg); border-radius: 10px;
    padding: 0 10px 0 6px; font-size: 12.5px; font-weight: 500; cursor: pointer; max-width: 170px; overflow: hidden;
  }
  .tab svg { width: 20px; height: 20px; flex-shrink: 0; }
  .tab b { font-weight: inherit; overflow: hidden; text-overflow: ellipsis; }
  .tab.active { border-color: var(--ink); font-weight: 700; }
  .tab.min { opacity: .55; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px;
    border: 1.5px solid var(--hard); border-radius: 999px; padding: 9px 20px; cursor: pointer;
    box-shadow: 3px 3px 0 var(--hard);
    transition: transform .08s ease, box-shadow .08s ease; text-decoration: none !important; white-space: nowrap;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--hard); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--hard); }
  .btn.secondary { background: var(--surface); color: var(--text); }
  .btn.sm { font-size: 13px; padding: 4px 14px; box-shadow: 2px 2px 0 var(--hard); }
  .btn.sm:hover { box-shadow: 3px 3px 0 var(--hard); }
  .btn.sm:active { box-shadow: 0 0 0 var(--hard); transform: translate(2px, 2px); }

  /* ---------- Desktop ---------- */
  .desktop { position: fixed; inset: 64px 0 92px 0; }
  .status-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; }

  /* ---------- Windows ---------- */
  .window {
    position: absolute; display: flex; flex-direction: column;
    background: var(--surface); border: 1.5px solid var(--ink); border-radius: 14px;
    box-shadow: 3px 3px 0 var(--hard); min-width: 300px; overflow: hidden;
    animation: rise .18s cubic-bezier(.2, .9, .3, 1.2);
    transition: box-shadow .12s;
  }
  .window.focused { box-shadow: 7px 7px 0 var(--hard); }
  @keyframes rise { from { transform: translateY(10px) rotate(-.6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  .window.min { display: none; }
  .window.max { left: 8px !important; top: 0 !important; width: calc(100% - 16px) !important; height: 100% !important; }
  .titlebar {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 12px;
    background: var(--surface); border-bottom: 1.5px solid var(--border-light);
    cursor: grab; user-select: none; touch-action: none; flex-shrink: 0;
  }
  .window.focused .titlebar { border-bottom-color: var(--ink); }
  .titlebar:active { cursor: grabbing; }
  .titlebar .title { font-family: "JetBrains Mono", monospace; font-size: 12.5px; font-weight: 500; flex: 1; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
  .window:not(.focused) .titlebar .title { opacity: .55; }
  .titlebar .title span { overflow: hidden; text-overflow: ellipsis; }
  .titlebar .title svg { width: 20px; height: 20px; flex-shrink: 0; }
  .ctrl { width: 26px; height: 26px; display: grid; place-items: center; border: 1.5px solid transparent; background: none; border-radius: 50%; cursor: pointer; color: var(--muted); }
  .ctrl:hover { border-color: var(--ink); color: var(--text); background: var(--surface-2); }
  .ctrl.close:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .window-body { flex: 1; overflow: auto; padding: 30px 36px 40px; }

  /* ---------- Content ---------- */
  h1, h2, h3 { line-height: 1.12; margin: 0; }
  h1 { font-size: clamp(32px, 4.4vw, 50px); font-weight: 600; letter-spacing: -.03em; }
  :lang(hy) h1 { font-size: clamp(26px, 3.2vw, 38px); letter-spacing: -.01em; line-height: 1.25; }
  h1.page { font-size: 36px; }
  :lang(hy) h1.page { font-size: 30px; }
  h2 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 40px 0 14px; }
  :lang(hy) h2 { font-size: 21px; letter-spacing: 0; line-height: 1.3; }
  h3 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .intro { color: var(--muted); margin: 8px 0 22px; font-size: 16px; }
  .eyebrow { display: inline-block; font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); margin-bottom: 16px; letter-spacing: .02em; }
  .eyebrow::before { content: ""; display: inline-block; width: 22px; height: 1.5px; background: var(--accent); vertical-align: middle; margin-right: 10px; }
  .hl { font-style: italic; background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding: 0 .08em; }

  .hero { display: grid; grid-template-columns: 1fr 190px; gap: 28px; align-items: center; }
  .hero .lead { font-size: 17.5px; color: var(--muted); margin: 16px 0 24px; max-width: 48ch; }
  .ctas { display: flex; gap: 12px; flex-wrap: wrap; }
  .mascot svg { width: 100%; transform: rotate(4deg); filter: drop-shadow(4px 4px 0 var(--hard)); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card {
    border: 1.5px solid var(--border-light); border-radius: 14px; padding: 16px; background: var(--bg);
    transition: transform .12s, border-color .12s, box-shadow .12s; text-align: left;
  }
  button.card:hover { border-color: var(--ink); box-shadow: 3px 3px 0 var(--hard); transform: translate(-1px, -1px); }
  button.card { cursor: pointer; width: 100%; }
  .card p { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }
  .tile { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 12px; color: #fff; flex-shrink: 0; }
  .tile svg { width: 18px; height: 18px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { padding: 4px 0 0; border-top: 1.5px solid var(--ink); }
  .stat b { display: block; font-family: "Fraunces", "Noto Serif Armenian", serif; font-weight: 600; font-size: 40px; letter-spacing: -.03em; line-height: 1.15; }
  .stat span { font-size: 13.5px; color: var(--muted); }

  .dashed { border: 0; border-top: 1.5px dotted var(--border); margin: 34px 0 16px; }
  .footer-note { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); text-align: center; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .section-head h2 { margin-bottom: 14px; }
  .link-btn { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 14px; }
  .link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { border: 1.5px solid var(--border); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip small { opacity: .6; font-size: 11.5px; font-family: "JetBrains Mono", monospace; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .rows { border-top: 1.5px solid var(--ink); }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 16px; align-items: center; padding: 16px 6px; cursor: pointer; border-bottom: 1px solid var(--border-light); transition: background .12s, padding .12s; }
  .row:hover { background: var(--highlight); padding-left: 12px; }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .tile { margin: 0; }
  .row p { margin: 2px 0 6px; font-size: 13.5px; color: var(--muted); }
  .row-side { display: flex; flex-direction: column; align-items: end; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 11.5px; font-weight: 500; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .pill.cat { display: inline-flex; align-items: center; gap: 5px; }
  .status { font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  :lang(hy) .status { text-transform: none; letter-spacing: 0; font-family: inherit; font-size: 11.5px; }
  .status.live { color: var(--green); }
  .status.ongoing { color: var(--blue); }
  .status.completed { color: var(--brown); }
  .status.archived { color: var(--muted); }

  .posts { width: 100%; border-collapse: collapse; border-top: 1.5px solid var(--ink); }
  .posts td { padding: 14px 8px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
  .posts tr { cursor: pointer; }
  .posts tr:hover td { background: var(--highlight); }
  .posts .date { color: var(--muted); font-size: 12.5px; white-space: nowrap; width: 120px; }
  .posts .rt { color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; }
  .post-title { font-family: "Fraunces", "Noto Serif Armenian", serif; font-weight: 600; font-size: 17px; }
  .posts small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }

  .about { display: grid; grid-template-columns: 150px 1fr; gap: 28px; align-items: start; }
  .avatar { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--ink); box-shadow: 5px 5px 0 var(--hard); overflow: hidden; background: var(--accent); }
  .avatar .monogram { width: 100%; height: 100%; font-size: 64px; border-radius: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .kv { display: grid; grid-template-columns: 140px 1fr; border-top: 1.5px solid var(--ink); font-size: 14px; }
  .kv > div { padding: 10px 4px; border-bottom: 1px solid var(--border-light); }
  .kv > div:nth-child(odd) { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
  ul.facts { padding-left: 20px; margin: 0; }
  ul.facts li { margin-bottom: 6px; }
  ul.facts li::marker { color: var(--accent); }

  .cv-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .cv-title { font-size: 16px; font-weight: 600; margin: 8px 0 2px; }
  .cv-contact { font-size: 14px; margin: 0; }
  .cv-actions { display: flex; gap: 10px; }
  .cv-summary { margin: 20px 0 0; padding: 4px 0 4px 18px; border-left: 3px solid var(--accent); font-size: 15.5px; line-height: 1.65; }
  .cv-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 32px; margin-top: 8px; align-items: start; }
  .cv-h { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 26px 0 10px; }
  :lang(hy) .cv-h { text-transform: none; letter-spacing: 0; font-size: 13.5px; font-family: inherit; }
  .jobs { display: grid; gap: 0; border-left: 1.5px solid var(--border); margin-left: 17px; }
  .job { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding: 4px 0 22px; margin-left: -19px; }
  .job-mark { width: 36px; height: 36px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-family: "Fraunces", serif; font-style: italic; font-weight: 700; font-size: 17px; border: 2px solid var(--surface); }
  .job-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .job-org { font-size: 14px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .job-when { font-size: 11.5px; white-space: nowrap; color: var(--muted); padding-top: 3px; }
  .job-desc { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .job-desc p { margin: 0 0 6px; font-style: italic; }
  .job-desc ul { margin: 0; padding-left: 18px; color: var(--text); }
  .job-desc li { margin-bottom: 5px; }
  .job-desc li::marker { color: var(--accent); }
  .cv-side { display: grid; gap: 14px; margin-top: 26px; }
  .side-card { border: 1.5px solid var(--ink); border-radius: 14px; padding: 16px; background: var(--bg); }
  .side-card h4 { margin: 0 0 10px; font-family: "JetBrains Mono", monospace; font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  :lang(hy) .side-card h4 { text-transform: none; letter-spacing: 0; font-size: 13.5px; font-family: inherit; }
  .skill-group + .skill-group { margin-top: 12px; }
  .skill-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .side-card .pill { background: var(--surface); font-size: 12px; padding: 1px 8px; }
  .edu + .edu { margin-top: 10px; }
  .edu .muted { font-size: 13.5px; }
  .small { font-size: 12px; }
  .lang-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 5px 0; }
  .lang-row + .lang-row { border-top: 1px solid var(--border-light); }
  .lang-row span:first-child { font-weight: 600; }

  @media print {
    body { overflow: visible; background: #fff; }

const svg = (name, extra = "") =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[name] || I.box}</svg>`;
const tile = (c, icon) => `<div class="tile" style="background:${color(c)}">${svg(icon)}</div>`;

// Initials for the logo and the avatar fallback, e.g. "Aram Mkhoyan" -> "AM".
const initials = name => String(name || "").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("") || "·";
const monogram = name => `<span class="monogram">${esc(initials(name))}</span>`;

// Rounded app tile used in the dock, window titles and tabs.
const appIcon = (c, glyph) => `<svg viewBox="0 0 48 48" aria-hidden="true">
  <rect x="2" y="2" width="44" height="44" rx="13" fill="${color(c)}" stroke="var(--hard)" stroke-width="2"/>
  <path d="M9 4h30a7 7 0 0 1 7 7v4H2v-4a7 7 0 0 1 7-7Z" fill="#fff" opacity=".14"/>
  <g transform="translate(12 12)" stroke="#fff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${I[glyph] || I.box}</g></svg>`;

// Masis and Sis, the two peaks of Ararat, as seen from Yerevan.
const ARARAT = "M0 230 L180 214 L330 196 L470 158 L560 104 L610 64 Q640 46 668 66 L730 112 L800 150 L840 142 L890 118 L930 104 L970 122 L1040 164 L1160 196 L1300 214 L1440 226";
const ararat = () => `<svg class="wall-ararat" viewBox="0 0 1440 240" preserveAspectRatio="xMidYMax slice">
  <path d="${ARARAT}" fill="none" stroke="var(--wall-line)" stroke-width="1.5"/>
  <path d="M560 104 L585 122 L606 108 L630 126 L652 106 L676 120 L700 92 M890 118 L905 128 L925 116 L945 128" fill="none" stroke="var(--wall-line)" stroke-width="1.5"/>
  <circle cx="1100" cy="70" r="34" fill="none" stroke="var(--wall-line)" stroke-width="1.5"/>
</svg>`;

// Postage stamp with Ararat and the sun — the home page illustration.
function stamp() {
  const holes = [];
  for (let x = 10; x <= 170; x += 16) holes.push(`<circle cx="${x}" cy="0" r="5"/><circle cx="${x}" cy="220" r="5"/>`);
  for (let y = 10; y <= 210; y += 16) holes.push(`<circle cx="0" cy="${y}" r="5"/><circle cx="180" cy="${y}" r="5"/>`);
  return `<svg viewBox="-6 -6 192 232" aria-hidden="true">
    <rect x="0" y="0" width="180" height="220" fill="var(--surface)" stroke="var(--hard)" stroke-width="1.5"/>
    <g fill="var(--bg)" stroke="var(--hard)" stroke-width="1.5">${holes.join("")}</g>
    <rect x="16" y="16" width="148" height="150" fill="var(--yellow)" stroke="var(--hard)" stroke-width="1.5"/>
    <circle cx="122" cy="58" r="20" fill="var(--accent)"/>
    <path d="M16 140 L52 98 Q60 90 68 98 L92 122 L112 108 L130 120 L164 136 V166 H16Z" fill="var(--surface)" stroke="var(--hard)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M44 107 L52 98 Q60 90 68 98 L76 106 L68 110 L60 104 L52 112Z M108 111 L112 108 L120 113 L114 116Z" fill="var(--hard)" opacity=".85"/>
    <path d="M16 150 Q60 138 100 150 T164 148 V166 H16Z" fill="var(--green)" stroke="var(--hard)" stroke-width="1.5"/>
    <text x="90" y="192" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3" fill="var(--text)">YEREVAN</text>
    <text x="90" y="208" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="700" font-size="13" fill="var(--accent)">☕ 1 espresso</text>
  </svg>`;
}

// An empty cup, for empty states.
const emptyCup = () => `<svg viewBox="0 0 120 100" aria-hidden="true" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="56" cy="88" rx="44" ry="6" stroke="var(--border)"/>
  <path d="M22 40h68v18a30 30 0 0 1-30 30h-8a30 30 0 0 1-30-30Z" fill="var(--surface)"/>
  <path d="M90 46h6a10 10 0 0 1 0 20h-8"/>
  <path d="M44 14q-6 8 0 14M58 10q-6 8 0 14M72 14q-6 8 0 14" stroke="var(--muted)" stroke-dasharray="3 5"/>
</svg>`;

// Coffee entries show in every language: the current one first, then any other.
const locAny = entry => merge(LANGS.filter(l => l !== lang).reduce((acc, l) => merge(acc, entry?.[l] || {}), {}), entry?.[lang] || {});

function openLightbox(src, caption) {
  const box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = `<figure><img src="${esc(src)}" alt="${esc(caption)}">${caption ? `<figcaption>${esc(caption)}</figcaption>` : ""}</figure>`;
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

  },

// Each section can have its translation switched off in the CMS (Site settings →
// Translations). Visitors then see that section in English, whatever is filled in.
const SECTIONS = ["home", "about", "projects", "writing", "coffee", "services", "resume", "contact"];
const sectionOf = id => ({ project: "projects", post: "writing", gear: "coffee", service: "services" })[id.split("/")[0]] || id;
const sectionLang = id => {
  const on = DATA.settings?.[DEFAULT_LANG]?.translations?.[sectionOf(id)];
  return lang !== DEFAULT_LANG && SECTIONS.includes(sectionOf(id)) && on === false ? DEFAULT_LANG : lang;
};
function withLang(l, fn) {
  const prev = [lang, T];
  lang = l; T = UI[l];
  try { return fn(); } finally { [lang, T] = prev; }
}

function getDef(id) {
  const def = buildDef(id);
  if (!def) return null;
  return {
    ...def,
    lang: () => sectionLang(id),
    title: () => withLang(sectionLang(id), def.title),
    icon: () => withLang(sectionLang(id), def.icon),
    render: () => withLang(sectionLang(id), def.render),
  };
}

function buildDef(id) {
  if (STATIC[id]) return { ...STATIC[id], title: () => T.files[id] };
  const [kind, slug] = id.split("/");
  if (kind === "project") {
    const raw = DATA.projects.find(p => p.slug === slug);
    if (!raw) return null;
    const p = () => ({ slug, ...locEntry(raw) });
    return {
      title: () => p().title, icon: () => appIcon(p().color, p().icon), w: 640, h: 600,
      render: () => {
        const d = p();
        return `
        <button class="link-btn back" data-open="projects">${T.allProjects}</button>
        ${hasLang(raw) ? "" : notInLang(raw)}
        ${d.image ? `<img class="cover" src="${esc(asset(d.image))}" alt="">` : ""}
        <h1 class="page">${esc(d.title)}</h1>
        <div class="detail-meta">
          ${d.category ? `<span class="pill cat"><i class="dot" style="background:${color(CATEGORY_COLORS[d.category])}"></i>${esc(T.categories[d.category] || d.category)}</span>` : ""}
          ${d.status ? `<span class="status ${esc(d.status)}">${esc(T.status[d.status] || d.status)}</span>` : ""}
          ${[d.role, d.year].filter(Boolean).map(x => `<span class="muted" style="font-size:14px">${esc(x)}</span>`).join('<span class="muted">·</span>')}
        </div>
        <p style="font-size:17px">${esc(d.summary)}</p>
        ${d.body ? `<div class="prose">${md(d.body)}</div>` : ""}
        ${(d.tags || []).length ? `<div class="pills" style="margin-top:16px">${d.tags.map(t => `<span class="pill mono">${esc(t)}</span>`).join("")}</div>` : ""}
        ${d.link ? `<p style="margin-top:22px"><a class="btn" href="${esc(d.link)}" target="_blank" rel="noopener">${T.visit}</a></p>` : ""}`;
      },
    };
  }
  if (kind === "service") {
    const raw = (DATA.services || []).find(x => x.slug === slug);
    if (!raw) return null;
    const v = () => ({ slug, ...locEntry(raw) });
    return {
      title: () => v().title, icon: () => appIcon("teal", "bag"), w: 660, h: 620,
      render: () => {
        const sv = v();
        return `
        <button class="link-btn back" data-open="services">${T.backToServices}</button>
        ${hasLang(raw) ? "" : notInLang(raw)}
        ${sv.image ? `<img class="cover" src="${esc(asset(sv.image))}" alt="">` : ""}
        <h1 class="page">${esc(sv.title)}</h1>
        <div class="svc-metas" style="margin:12px 0 16px">${serviceMeta(sv)}</div>
        ${sv.summary ? `<p style="font-size:17px">${esc(sv.summary)}</p>` : ""}
        ${(sv.includes || []).length ? `<h2 class="cv-h">${T.included}</h2><ul class="checklist">${sv.includes.map(i => `<li>${svg("check")}<span>${esc(i)}</span></li>`).join("")}</ul>` : ""}
        ${sv.body ? `<div class="prose" style="margin-top:16px">${md(sv.body)}</div>` : ""}
        <div class="svc-buy">
          <span class="svc-price">${esc(sv.price || T.priceOnRequest)}</span>
          <a class="btn" href="${esc(bookHref(sv))}" ${sv.booking_url ? 'target="_blank" rel="noopener"' : ""}>${T.book}</a>
        </div>`;
      },
    };
  }
  if (kind === "gear") {
    const raw = (DATA.coffee?.equipment || []).find(g => g.slug === slug);
    if (!raw) return null;
    const g = () => locAny(raw);
    return {
      title: () => g().name, icon: () => appIcon("brown", g().type === "grinder" ? "grinder" : "coffee"), w: 700, h: 640,
      render: () => {
        const d = g();
        const photos = (d.photos || []).map(p => p?.photo ?? p).filter(Boolean);
        return `
        <button class="link-btn back" data-open="coffee">${T.backToCoffee}</button>
        ${d.image ? `<img class="cover gear-cover" src="${esc(asset(d.image))}" alt="${esc(d.name)}">` : ""}
        <h1 class="page">${esc(d.name)}</h1>
        <div class="detail-meta">
          ${d.type ? `<span class="pill cat"><i class="dot" style="background:var(--brown)"></i>${esc(T.gearTypes[d.type] || d.type)}</span>` : ""}
          ${d.since ? `<span class="muted" style="font-size:14px">${esc(T.usingSince(d.since))}</span>` : ""}
        </div>
        ${d.notes ? `<p style="font-size:17px">${esc(d.notes)}</p>` : ""}
        ${d.body ? `<div class="prose">${md(d.body)}</div>` : ""}
        ${photos.length ? `<div class="art-grid" style="margin-top:18px">${photos.map(p => `
          <button class="art" data-src="${esc(asset(p))}" data-caption=""><img src="${esc(asset(p))}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
        ${d.link ? `<p style="margin-top:22px"><a class="btn" href="${esc(d.link)}" target="_blank" rel="noopener">${T.visit}</a></p>` : ""}`;
      },
    };
  }
  if (kind === "post") {
    const raw = DATA.posts.find(p => p.slug === slug);
    if (!raw) return null;
    const p = () => locEntry(raw);
    return {
      title: () => p().title, icon: () => appIcon("purple", "doc"), w: 680, h: 620,
      render: () => {
        const d = p();
        return `
        <button class="link-btn back" data-open="writing">${T.allPosts}</button>
        ${hasLang(raw) ? "" : notInLang(raw)}
        <h1 class="page">${esc(d.title)}</h1>
        <p class="muted mono" style="font-size:13px;margin:10px 0 22px">${fmtDate(d.date)} · ${T.minRead(minutes(d.body))}</p>
        <div class="prose">${md(d.body)}</div>`;
      },
    };
  }
  return null;
}

/* =====================================================================
   Window manager
   ===================================================================== */
const desktop = document.getElementById("desktop");
const tabsEl = document.getElementById("tabs");
const isMobile = () => matchMedia("(max-width: 768px)").matches;
const open = new Map(); // id -> { el, def }
let z = 10, cascade = 0;

function setHash(id) {
  const url = new URL(location.href);
  url.hash = id ? "#" + id : "";
  history.replaceState(null, "", id ? url : url.pathname + url.search);
}

function focusWin(id) {
  const w = open.get(id);
  if (!w) return;
  w.el.classList.remove("min");
  w.el.style.zIndex = ++z;
  open.forEach((o, k) => {
    o.el.classList.toggle("focused", k === id);
    if (isMobile() && k !== id) o.el.classList.add("min"); // one window at a time on phones
  });
  setHash(id);
  renderTabs();
}

function paintWin(w) {
  w.el.querySelector(".title").innerHTML = `${w.def.icon()}<span>${esc(w.def.title())}</span>`;
  w.el.setAttribute("aria-label", w.def.title());
  renderBody(w);
}
function renderBody(w) {
  const body = w.el.querySelector(".window-body");
  body.lang = w.def.lang();
  body.innerHTML = w.def.render();
}

function openWin(id) {
  if (open.has(id)) return focusWin(id);
  const def = getDef(id);
  if (!def) return;

  const el = document.createElement("section");
  el.className = "window";
  el.dataset.win = id;
  const dw = desktop.clientWidth, dh = desktop.clientHeight;
  const w = Math.min(def.w, dw - 32), h = Math.min(def.h, dh - 32);
  const offset = (cascade++ % 6) * 28;
  el.style.width = w + "px";
  el.style.height = h + "px";
  el.style.left = Math.max(16, Math.min((dw - w) / 2 + offset - 40, dw - w - 16)) + "px";
  el.style.top = Math.max(12, Math.min((dh - h) / 2 + offset - 30, dh - h - 12)) + "px";
  el.innerHTML = `
    <div class="titlebar">
      <div class="title"></div>
      <button class="ctrl minimize" aria-label="Minimize">${svg("min", 'width="14" height="14"')}</button>
      <button class="ctrl maximize" aria-label="Maximize">${svg("max", 'width="13" height="13"')}</button>
      <button class="ctrl close" aria-label="Close">${svg("close", 'width="14" height="14"')}</button>
    </div>
    <div class="window-body"></div>`;

  el.addEventListener("pointerdown", () => focusWin(id));
  el.querySelector(".close").onclick = e => { e.stopPropagation(); closeWin(id); };
  el.querySelector(".minimize").onclick = e => { e.stopPropagation(); minimizeWin(id); };
  el.querySelector(".maximize").onclick = () => el.classList.toggle("max");
  el.querySelector(".titlebar").addEventListener("dblclick", e => { if (!e.target.closest(".ctrl")) el.classList.toggle("max"); });
  makeDraggable(el);

  const win = { el, def };
  paintWin(win);
  desktop.appendChild(el);
  open.set(id, win);
  focusWin(id);
}

function closeWin(id) {
  open.get(id)?.el.remove();
  open.delete(id);
  focusTop();
}

function minimizeWin(id) {
  const w = open.get(id);
  if (!w) return;
  w.el.classList.add("min");
  w.el.classList.remove("focused");
  focusTop();
}

function focusTop() {
  let top = null, topZ = -1;
  open.forEach((w, k) => { if (!w.el.classList.contains("min") && +w.el.style.zIndex > topZ) { top = k; topZ = +w.el.style.zIndex; } });
  if (top) focusWin(top);
  else { setHash(null); renderTabs(); }
}

function makeDraggable(el) {
  const bar = el.querySelector(".titlebar");
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest(".ctrl") || isMobile() || el.classList.contains("max")) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    bar.setPointerCapture(e.pointerId);
    const move = ev => {
      const maxX = desktop.clientWidth - 80, maxY = desktop.clientHeight - 36;
      el.style.left = Math.max(-el.offsetWidth + 80, Math.min(ev.clientX - sx, maxX)) + "px";
      el.style.top = Math.max(0, Math.min(ev.clientY - sy, maxY)) + "px";
    };
    const up = () => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
  });
}

function renderTabs() {
  // Apps in the dock show a dot when open; other windows (a project, a post…) get a tab.
  document.querySelectorAll(".dock-app").forEach(b => {
    const w = open.get(b.dataset.open);
    b.classList.toggle("open", !!w);
    b.classList.toggle("active", !!w && w.el.classList.contains("focused"));
  });
  tabsEl.innerHTML = "";
  open.forEach((w, id) => {
    if (DOCK.includes(id)) return;
    const b = document.createElement("button");
    b.className = "tab" + (w.el.classList.contains("focused") ? " active" : "") + (w.el.classList.contains("min") ? " min" : "");
    b.innerHTML = `${w.def.icon()}<b>${esc(w.def.title())}</b>`;
    b.title = w.def.title();
    b.onclick = () => (w.el.classList.contains("focused") ? minimizeWin(id) : focusWin(id));
    tabsEl.appendChild(b);
  });
}

/* =====================================================================
   Chrome (menubar, icons) + language switching
   ===================================================================== */
const DOCK = ["home", "about", "projects", "writing", "coffee", "services", "resume", "contact", "trash"];

function renderChrome() {
  const s = S();
  document.documentElement.lang = lang;
  document.title = s.name || "";
  document.getElementById("logo-name").textContent = s.logo_text || s.name || "";
  document.querySelectorAll("[data-t]").forEach(el => (el.textContent = T[el.dataset.t]));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.getElementById("logo-mark").textContent = initials(s.name);
  document.getElementById("wall-name").textContent = s.name || "";
  const app = id => `<button class="dock-app" data-open="${id}" aria-label="${esc(T.files[id])}">${STATIC[id].icon()}<span>${esc(T.files[id])}</span></button>`;
  document.getElementById("dock-apps").innerHTML = DOCK.filter(id => id !== "trash").map(app).join("");
  document.getElementById("dock-trash").innerHTML = app("trash");
  renderTabs();
}

function setLang(next) {
  if (!LANGS.includes(next) || next === lang) return;
  lang = next;
  T = UI[lang];
  store.set("lang", lang);
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
  renderChrome();
  open.forEach(paintWin);
  renderTabs();
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", e => {
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) return setLang(langBtn.dataset.lang);
  const coffeeBtn = e.target.closest("[data-coffee-tab]");
  if (coffeeBtn) {
    coffeeTab = coffeeBtn.dataset.coffeeTab;
    const w = open.get("coffee");
    if (w) renderBody(w);
    return;
  }
  const art = e.target.closest(".art[data-src]");
  if (art) return openLightbox(art.dataset.src, art.dataset.caption);
  const filter = e.target.closest("[data-filter]");
  if (filter) {
    projectFilter = filter.dataset.filter;
    const w = open.get("projects");
    if (w) renderBody(w);
    return;
  }
  if (e.target.closest("a")) return;
  const dockApp = e.target.closest(".dock-app");
  if (dockApp && open.get(dockApp.dataset.open)?.el.classList.contains("focused")) return minimizeWin(dockApp.dataset.open);
  const t = e.target.closest("[data-open]");
  if (t) openWin(t.dataset.open);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".lightbox")) return document.querySelector(".lightbox").remove();
  if (e.key === "Escape") {
    const focused = [...open].find(([, w]) => w.el.classList.contains("focused"));
    if (focused) closeWin(focused[0]);
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button][data-open], tr[data-open]")) {
    e.preventDefault();
    openWin(e.target.dataset.open);
  }
});
window.addEventListener("hashchange", () => openWin(decodeURIComponent(location.hash.slice(1))));

/* Theme */
const themeBtn = document.getElementById("theme");
const root = document.documentElement;
const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
const paintThemeBtn = () => (themeBtn.innerHTML = svg(isDark() ? "sun" : "moon", 'width="17" height="17"'));
const savedTheme = store.get("theme");
if (savedTheme) root.dataset.theme = savedTheme;
paintThemeBtn();
themeBtn.onclick = () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  store.set("theme", root.dataset.theme);
  paintThemeBtn();
};

/* Clock */
const clock = document.getElementById("clock");
const tick = () => (clock.textContent = new Date().toLocaleTimeString(lang === "hy" ? "hy-AM" : [], { hour: "numeric", minute: "2-digit" }));
tick(); setInterval(tick, 15000);

/* =====================================================================
   Boot
   ===================================================================== */
document.getElementById("prerender")?.remove();
document.getElementById("wall-ararat").innerHTML = ararat();
renderChrome();

(async () => {
  const status = document.createElement("div");
  status.className = "status-msg";
  status.textContent = T.loading;
  desktop.appendChild(status);
  try {
    const res = await fetch("content/index.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    status.remove();
  } catch (err) {
    status.textContent = T.loadError;
    console.error(err);
    return;
  }
  renderChrome();
  const initial = decodeURIComponent(location.hash.slice(1));
  if (initial && getDef(initial)) {
    if (!STATIC[initial] && !isMobile()) openWin("home");
    openWin(initial);
  } else openWin("home");
})();
